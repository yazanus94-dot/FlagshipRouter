name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Repo-wide lint report (informational)
        run: |
          set +e
          npx eslint . --ext .js,.mjs > eslint-full-report.txt 2>&1
          status=$?
          set -e
          {
            echo "## Repo-wide ESLint report"
            echo ""
            echo "This report covers the whole repository and is **not** the merge gate:"
            echo "the repository carries pre-existing lint debt that predates this pipeline."
            echo "The mandatory gate below lints only files changed by this push/PR."
            echo '```'
            tail -n 5 eslint-full-report.txt
            echo "eslint exit code: ${status}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload repo-wide lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-full-report
          path: eslint-full-report.txt
          retention-days: 7
      - name: Determine changed JavaScript files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD~1"
            fi
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.js' '*.mjs' | tr '\n' ' ')
          echo "Changed JS files: ${files:-<none>}"
          echo "files=${files}" >> "$GITHUB_OUTPUT"
      - name: ESLint (changed files, mandatory)
        if: steps.changed.outputs.files != ''
        run: npx eslint ${{ steps.changed.outputs.files }}
      - name: Prettier (changed files, mandatory)
        run: npx prettier --check ${{ steps.changed.outputs.files }}
  test:
    name: Run Tests (mandatory suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Run mandatory Vitest suite
        working-directory: tests
        run: npx vitest run $(cat ci/mandatory.txt)
  test-full:
    name: Full Suite (regression gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Run full suite and compare against the documented baseline
        working-directory: tests
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=full-suite.json
          vitest_status=$?
          set -e
          echo "vitest exit code: ${vitest_status}"
          if [ ! -f full-suite.json ]; then
            echo "::error::Vitest produced no JSON report; cannot evaluate the baseline."
            exit 1
          fi
          node ci/compare-baseline.mjs full-suite.json ci/known-failures.json
      - name: Upload full suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-report
          path: tests/full-suite.json
          retention-days: 7
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next
            public
  cli-build:
    name: Build CLI
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci
      - name: Install root dependencies
        run: npm ci
      - name: Build CLI
        working-directory: cli
        run: npm run build
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-build
          path: cli/dist
          retention-days: 1
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build, cli-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: flagshiprouter:ci-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and verify health endpoint
        run: |
          docker run --rm -d --name test-container \
            -p 20128:20128 \
            -e DATA_DIR=/tmp/test-data \
            -e JWT_SECRET=test-secret \
            -e INITIAL_PASSWORD=test-password \
            flagshiprouter:ci-${{ github.sha }}
          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:20128/api/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          echo "--- container logs ---"
          docker logs test-container
          docker rm -f test-container >/dev/null 2>&1 || true
          if [ "$healthy" -ne 1 ]; then
            echo "::error::Container did not become healthy on /api/health within 60s."
            exit 1
          fi
          echo "Health check passed."
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies (npm audit)
        run: npm audit --audit-level=high
      - name: Audit dependencies (report artifact)
        run: npm audit --audit-level=high --json > npm-audit-report.json
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30
      # Snyk was removed rather than kept with `continue-on-error`: the
      # repository has no SNYK_TOKEN secret, so the step could never produce a
      # real result. npm audit above is the mandatory dependency gate.
      - name: Scan for secrets (pull request range)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
      - name: Scan for secrets (push, full history)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, test, test-full, build, cli-build, docker-build, security-scan]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "::warning::CI pipeline failed. Check GitHub Actions for details."
          echo "Repository: ${{ github.repository }}"
          echo "Run: ${{ github.run_id }}"